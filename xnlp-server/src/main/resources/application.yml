server:
  address: ${XNLP_HOST:0.0.0.0}
  port: ${XNLP_PORT:8760}

spring:
  application:
    name: xnlp-server
  profiles:
    default: mysql
  sql:
    init:
      # Versioned migrations own schema creation and upgrades.
      mode: never
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:0}
  ai:
    # Spring AI 2.x uses one active ChatModel provider per application context.
    # Switch between providers without code changes: SPRING_AI_MODEL_CHAT=openai|ollama.
    model:
      chat: ${SPRING_AI_MODEL_CHAT:ollama}
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
        temperature: ${OPENAI_TEMPERATURE:0.2}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_CHAT_MODEL:llama3.1}
        options:
          temperature: ${OLLAMA_TEMPERATURE:0.2}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB

management:
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active:dev}
    export:
      prometheus:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    enabled: true
    sampling:
      probability: ${OTEL_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  file:
    path: ${LOG_PATH:/var/log/xnlp}

xnlp:
  server:
    host: 0.0.0.0
    port: ${XNLP_PORT:8760}
    max-workers: ${XNLP_MAX_WORKERS:4}
    request-timeout-seconds: ${XNLP_REQUEST_TIMEOUT_SECONDS:60}
    max-batch-size: ${XNLP_MAX_BATCH_SIZE:32}
  database:
    migration:
      enabled: ${XNLP_DB_MIGRATION_ENABLED:true}
      validate-checksums: ${XNLP_DB_MIGRATION_VALIDATE_CHECKSUMS:true}
  security:
    enabled: ${XNLP_SECURITY_ENABLED:false}
    header-name: ${XNLP_SECURITY_HEADER:X-API-Key}
    tenant-header-name: ${XNLP_SECURITY_TENANT_HEADER:X-Tenant-ID}
    default-tenant-id: ${XNLP_SECURITY_DEFAULT_TENANT:default}
    api-keys: ${XNLP_SECURITY_API_KEYS:}
    # Optional tenant -> API key map. Environment binding example:
    # XNLP_SECURITY_API_KEY_TENANTS_TENANT_A=secret-a
    api-key-tenants: {}
  models:
    - name: ollama-default
      version: latest
      model-name: ${OLLAMA_CHAT_MODEL:llama3.1}
      model-path: ${OLLAMA_CHAT_MODEL:llama3.1}
      provider: ollama
      protocol: OLLAMA_CHAT
      backend: ollama
      device: cpu
      max-input-length: 4096
      max-output-length: 2048

# Local append-only demo storage; replace with an object-storage adapter in production.
waste:
  upload-dir: ${WASTE_UPLOAD_DIR:./data/waste-uploads}
