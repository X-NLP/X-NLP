server:
  address: ${XNLP_HOST:0.0.0.0}
  port: ${XNLP_PORT:8760}

spring:
  application:
    name: xnlp-server
  profiles:
    default: mysql
  sql:
    init:
      # Versioned migrations own schema creation and upgrades.
      mode: never
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:0}
  ai:
    # Spring AI 2.x uses one active ChatModel provider per application context.
    # Switch between providers without code changes: SPRING_AI_MODEL_CHAT=openai|ollama.
    model:
      chat: ${SPRING_AI_MODEL_CHAT:ollama}
      embedding: ${SPRING_AI_MODEL_EMBEDDING:none}
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      embedding:
        model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
      chat:
        model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
        temperature: ${OPENAI_TEMPERATURE:0.2}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
      chat:
        model: ${OLLAMA_CHAT_MODEL:llama3.1}
        options:
          temperature: ${OLLAMA_TEMPERATURE:0.2}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB

management:
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active:dev}
    export:
      prometheus:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    enabled: true
    sampling:
      probability: ${OTEL_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  file:
    path: ${LOG_PATH:/var/log/xnlp}

xnlp:
  server:
    host: 0.0.0.0
    port: ${XNLP_PORT:8760}
    max-workers: ${XNLP_MAX_WORKERS:4}
    request-timeout-seconds: ${XNLP_REQUEST_TIMEOUT_SECONDS:60}
    max-batch-size: ${XNLP_MAX_BATCH_SIZE:32}
  database:
    migration:
      enabled: ${XNLP_DB_MIGRATION_ENABLED:true}
      validate-checksums: ${XNLP_DB_MIGRATION_VALIDATE_CHECKSUMS:true}
  nlp:
    runtime:
      sentiment-mode: ${XNLP_SENTIMENT_RUNTIME_MODE:BUILTIN}
    onnx:
      enabled: ${XNLP_ONNX_ENABLED:false}
      runtime-name: ${XNLP_ONNX_RUNTIME_NAME:onnx-sentiment}
      model-path: ${XNLP_ONNX_MODEL_PATH:}
      model-version: ${XNLP_ONNX_MODEL_VERSION:}
      model-sha256: ${XNLP_ONNX_MODEL_SHA256:}
      input-name: ${XNLP_ONNX_INPUT_NAME:x}
      output-name: ${XNLP_ONNX_OUTPUT_NAME:y}
      timeout: ${XNLP_ONNX_TIMEOUT:2s}
      max-model-bytes: ${XNLP_ONNX_MAX_MODEL_BYTES:268435456}
      max-tensor-elements: ${XNLP_ONNX_MAX_TENSOR_ELEMENTS:1000000}
      max-concurrency: ${XNLP_ONNX_MAX_CONCURRENCY:2}
      queue-capacity: ${XNLP_ONNX_QUEUE_CAPACITY:16}
      negative-threshold: ${XNLP_ONNX_NEGATIVE_THRESHOLD:0.45}
      positive-threshold: ${XNLP_ONNX_POSITIVE_THRESHOLD:0.55}
  rag:
    ingestion:
      default-embedding-model: ${XNLP_DEFAULT_EMBEDDING_MODEL:configured-embedding-model}
      batch-size: ${XNLP_INGESTION_BATCH_SIZE:32}
      max-retries: ${XNLP_INGESTION_MAX_RETRIES:2}
      retry-backoff: ${XNLP_INGESTION_RETRY_BACKOFF:200ms}
      core-pool-size: ${XNLP_INGESTION_CORE_POOL_SIZE:2}
      max-pool-size: ${XNLP_INGESTION_MAX_POOL_SIZE:4}
      queue-capacity: ${XNLP_INGESTION_QUEUE_CAPACITY:100}
    retrieval:
      max-retries: ${XNLP_RETRIEVAL_MAX_RETRIES:1}
      retry-backoff: ${XNLP_RETRIEVAL_RETRY_BACKOFF:100ms}
      rerank-failure-policy: ${XNLP_RERANK_FAILURE_POLICY:FALLBACK}
    chat:
      max-context-characters: ${XNLP_RAG_MAX_CONTEXT_CHARACTERS:12000}
      citation-excerpt-characters: ${XNLP_RAG_CITATION_EXCERPT_CHARACTERS:240}
      default-timeout: ${XNLP_RAG_DEFAULT_TIMEOUT:30s}
      max-timeout: ${XNLP_RAG_MAX_TIMEOUT:2m}
      core-pool-size: ${XNLP_RAG_CORE_POOL_SIZE:2}
      max-pool-size: ${XNLP_RAG_MAX_POOL_SIZE:8}
      queue-capacity: ${XNLP_RAG_QUEUE_CAPACITY:100}
  security:
    enabled: ${XNLP_SECURITY_ENABLED:false}
    # DISABLED, API_KEY, JWT, or HYBRID. When omitted, enabled=true preserves API_KEY compatibility.
    mode: ${XNLP_SECURITY_MODE:}
    header-name: ${XNLP_SECURITY_HEADER:X-API-Key}
    tenant-header-name: ${XNLP_SECURITY_TENANT_HEADER:X-Tenant-ID}
    default-tenant-id: ${XNLP_SECURITY_DEFAULT_TENANT:default}
    api-keys: ${XNLP_SECURITY_API_KEYS:}
    # Optional tenant -> API key map. Environment binding example:
    # XNLP_SECURITY_API_KEY_TENANTS_TENANT_A=secret-a
    jwt:
      issuer-uri: ${XNLP_SECURITY_JWT_ISSUER_URI:}
      jwk-set-uri: ${XNLP_SECURITY_JWT_JWK_SET_URI:}
      audience: ${XNLP_SECURITY_JWT_AUDIENCE:}
      tenant-claim: ${XNLP_SECURITY_JWT_TENANT_CLAIM:tenant_id}
      roles-claim: ${XNLP_SECURITY_JWT_ROLES_CLAIM:roles}
      clock-skew: ${XNLP_SECURITY_JWT_CLOCK_SKEW:60s}
      default-roles: ${XNLP_SECURITY_JWT_DEFAULT_ROLES:VIEWER}
  models:
    - name: ollama-default
      version: latest
      model-name: ${OLLAMA_CHAT_MODEL:llama3.1}
      model-path: ${OLLAMA_CHAT_MODEL:llama3.1}
      provider: ollama
      protocol: OLLAMA_CHAT
      backend: ollama
      device: cpu
      max-input-length: 4096
      max-output-length: 2048

# Local append-only demo storage; replace with an object-storage adapter in production.
waste:
  upload-dir: ${WASTE_UPLOAD_DIR:./data/waste-uploads}
