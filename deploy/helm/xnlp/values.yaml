replicaCount: 1

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

server:
  image:
    repository: ghcr.io/x-nlp/xnlp-server
    tag: "0.4.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8760
  resources: {}
  env:
    profile: h2
    port: 8760
    aiModelChat: ollama
    aiModelEmbedding: none
    ollamaBaseUrl: http://ollama:11434
    ollamaChatModel: llama3.1
    ollamaEmbeddingModel: nomic-embed-text
    dbPoolMaxSize: "10"
    dbPoolMinIdle: "2"
  database:
    url: jdbc:h2:file:/opt/xnlp/data/xnlp;MODE=MySQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    username: sa
    password: ""
  security:
    enabled: false
    mode: ""
    headerName: X-API-Key
    tenantHeaderName: X-Tenant-ID
    defaultTenant: default
    apiKeys: ""
    jwt:
      issuerUri: ""
      jwkSetUri: ""
      audience: ""
      tenantClaim: tenant_id
      rolesClaim: roles
      clockSkew: 60s
      defaultRoles: VIEWER
  openai:
    apiKey: ""
    baseUrl: https://api.openai.com
    chatModel: gpt-4o-mini
    embeddingModel: text-embedding-3-small
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

frontend:
  enabled: true
  image:
    repository: ghcr.io/x-nlp/xnlp-frontend
    tag: "0.4.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: xnlp.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podSecurityContext:
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: false
  runAsNonRoot: true

resources: {}
